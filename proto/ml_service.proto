syntax = "proto3";

package ml;

service MLService {
  rpc Predict (PredictRequest) returns (PredictResponse);
}

message PredictRequest {
  bytes image = 1;
}

message PredictResponse {
  float talc_percentage = 1;
  bytes overlay_png = 2;
  bytes mask_png = 3;
  string predicted_class = 4;
  map<string, float> class_probabilities = 5;
}