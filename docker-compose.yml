version: "3.9"

services:

  image-service:
    build:
      context: ./image_service
    container_name: image_service
    ports:
      - "8001:8000"
    volumes:
      - ./image_service:/app
    restart: unless-stopped

  ml-service:
    build:
      context: ./ml_service
    container_name: ml_service
    ports:
      - "50051:50051"