services:

  ml-service:
    build:
      context: ./ml_service
    container_name: ml_service
    ports:
      - "50051:50051"
    restart: unless-stopped

  image-service:
    build:
      context: ./image_service
    container_name: image_service
    ports:
      - "8001:8000"
    volumes:
      - ./image_service:/app
    depends_on:
      - ml-service
    restart: unless-stopped